name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: selftest
        run: python3 mindcore/tests/selftest.py
      - name: self model
        run: python3 mindcore/tests/test_self.py
      - name: retrieval and panel
        run: python3 mindcore/tests/test_v43.py
